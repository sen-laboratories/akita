    <path d="M110 264 L152 174 L174 126 C188 94 206 62 220 62 C230 62 238 78 244 92 L288 72 C312 46 340 16 352 16 C364 16 367 52 365 105 C382 118 394 134 396 156 L396 180 C408 186 420 192 424 202 C428 214 426 232 418 244 C408 260 392 270 376 276 L376 306 L253 364 L158 318 Z" fill="#F8F5EE" />

