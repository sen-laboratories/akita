    <!-- Kanji "秋田" (Isometric Perspective) -->
    <g fill="none" stroke="#513624" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- 秋 -->
      <path d="M70 315 L100 321 M70 336 L102 352 M87 321 L87 401 M87 346 L70 374 M87 354 L100 375" />
      <path d="M112 346 L107 366 M146 361 L137 378 M125 329 L125 366 C125 384 116 398 104 406 M125 368 C132 392 140 412 148 426" />
      <!-- 田 -->
      <path d="M167 358 L167 438 M167 360 L229 390 L229 468 M167 431 L229 461 M198 375 L198 446 M167 395 L229 425" />
    </g>
  </g>

  <!-- 3D Bone Handle -->
  <g id="bone" stroke="#513624" stroke-linejoin="round" stroke-linecap="round">
    <!-- Extruded 3D Side (Medium Tan Base) -->
    <path d="M320 392 L294 379 C280 385 276 410 288 423 C276 435 276 454 290 459 L316 472 L348 438 L412 406 L436 419 L450 414 L456 336 L422 322 C406 318 394 334 394 354 L334 386 Z" fill="#D7AE86" stroke-width="5.5" />

    <!-- Extruded 3D Top Bevels (Light Tan Highlights) -->
    <path d="M294 379 C304 374 316 376 326 382 L344 394 L320 392 Z" fill="#E9CDA8" stroke="none" />
    <path d="M334 386 L394 354 C394 334 408 320 424 323 L452 336 L420 368 L348 404 Z" fill="#E9CDA8" stroke="none" />

    <!-- Redraw crisp 3D extrusion outline -->
    <path d="M326 389 L302 377 C286 374 274 398 286 422 C274 436 276 454 290 460 L316 472 M334 386 L394 354 C394 334 408 318 424 323 L452 336 M412 406 L436 419" fill="none" stroke="#513624" stroke-width="5.5" />

    <!-- Bone Front Face (Pale Cream) -->
    <path d="M348 404 L420 368 C420 344 442 326 456 336 C466 344 464 364 452 374 C466 380 466 402 450 414 C436 424 422 418 420 402 L348 438 C348 458 332 476 316 472 C304 468 304 448 316 436 C302 428 304 402 320 392 C334 384 348 390 348 404 Z" fill="#EAE1BD" stroke-width="5" />
  </g>
