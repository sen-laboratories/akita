    <path d="M27.6 9.8 C26 13.2 25.4 17.8 25.4 22.2 L26.2 23.4 L25.4 28.8 L26.2 32.2 L29.8 34.4 L28.8 35.8 C29.4 38.4 31.2 41 33.6 43 L32 44.5 L22 39.5 L16 32 L21.2 21.2 C23 15.8 25.4 10 27.6 9.8 Z" fill="#D4CDC2" />

