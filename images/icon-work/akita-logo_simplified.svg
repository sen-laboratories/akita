    <path d="M336 118 L352 109" fill="none" stroke="#513624" stroke-width="3.5" />

    <!-- Ear & Cheek Contour Strokes -->
    <path d="M350 18 L318 86 M288 72 L365 105" fill="none" stroke="#513624" stroke-width="4" />
    <path d="M215 76 C202 108 199 144 202 176 L254 118" fill="none" stroke="#513624" stroke-width="4" />
    <path d="M174 126 L176 164 M152 174 L151 246 M273 153 L246 194 M242 204 L243 286 M190 272 C218 284 248 298 270 314" fill="none" stroke="#513624" stroke-width="3.8" />
    <path d="M176 165 L226 190" fill="none" stroke="#C5BFB5" stroke-width="3.5" />

    <!-- Eyes -->
    <path d="M291 192 L308 175 L318 178 L328 188 L308 196 Z" fill="#513624" />
    <path d="M364 152 L376 148 L374 165 L366 169 L362 162 Z" fill="#513624" />

    <!-- Nose -->
