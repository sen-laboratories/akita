    <!-- Left ear outer back + left neck & chest shadow -->
    <path d="M174 126 C188 94 206 62 218 64 L202 176 L248 128 L278 142 L242 198 L242 260 C254 276 272 288 290 290 L318 276 L356 276 L356 312 L284 344 C282 326 270 314 242 300 L242 326 C206 314 176 286 152 252 L148 282 L110 264 L152 174 Z" fill="#DDD8CE" />
