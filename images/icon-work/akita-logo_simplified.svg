    <path d="M14.6 41.8 L14.3 43.5 M18.8 43.6 L18.0 45.3 M16.5 40.2 L16.5 44.4 Q16.5 47.2 14.5 48.8 M16.5 45.0 L19.0 50.8" fill="none" stroke-width="1.1" />

