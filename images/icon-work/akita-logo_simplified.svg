    <!-- Mouth & Smile -->
    <path d="M408 226 L408 242 M408 240 L422 244 M408 240 C392 256 374 264 352 264 C338 264 328 258 320 254" fill="none" stroke="#513624" stroke-width="5.5" />
    <circle cx="320" cy="254" r="4.5" fill="#513624" />

    <!-- Main Dog Outline -->
    <path d="M110 264 L152 174 L174 126 C188 94 206 62 220 62 C230 62 238 78 244 92 L288 72 C312 46 340 16 352 16 C364 16 367 52 365 105 C382 118 394 134 396 156 L396 180 C408 186 420 192 424 202 C428 214 426 232 418 244 C408 260 392 270 376 276 L316 276 L288 290 M376 276 L376 306" fill="none" stroke="#513624" stroke-width="5.5" />
  </g>

  <!-- Wooden Box: Front Faces, Rim & Kanji -->
  <g id="box-front" stroke="#513624" stroke-linejoin="round" stroke-linecap="round">
    <!-- Inner right corner piece behind dog -->
    <path d="M376 276 L406 284 L376 300 Z" fill="#AF7A4D" stroke-width="4.5" />

    <!-- Front-Left Face -->
    <path d="M54 250 L134 290 L154 326 L253 374 L253 498 L62 405 C56 402 54 396 54 388 Z" fill="#C7905D" stroke-width="5.5" />

    <!-- Front-Right Face (Light base) -->
    <path d="M253 374 L438 284 L438 408 L253 498 Z" fill="#E3B987" stroke-width="5.5" />
    <!-- Front-Right Face (Diagonal Shadow) -->
    <path d="M253 430 L398 332 L438 352 L438 408 L253 498 Z" fill="#C7905D" stroke="none" />
    <!-- Redraw crisp Front-Right outline over shadow -->
    <path d="M253 374 L438 284 L438 408 L253 498 Z" fill="none" stroke="#513624" stroke-width="5.5" />

    <!-- Top Rim (Front-Left + Front-Right) -->
