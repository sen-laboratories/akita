name: Akita against the newest Haiku nightly

# Akita uses private classes of Haiku: a nightly can take away what it needs (hrev60299_3 did, BPrivate::JobQueue). Every day this takes the newest nightly and the
# Akita and FileTypes packages of Kiri, and checks that every symbol that they need is there (abi-check.sh). It fails, and GitHub tells the owner, when one is missing.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  abi-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Haiku host tools (package)
        run: |
          mkdir -p bin
          curl -sL https://raw.githubusercontent.com/haiku/haiku-toolchains-ubuntu/master/fetch.sh -o fetch.sh
          chmod +x fetch.sh
          HOSTTOOLS_URL=$(./fetch.sh --hosttools)
          curl -sL "$HOSTTOOLS_URL" -o hosttools.zip
          unzip -q hosttools.zip -d bin/
          chmod +x bin/*
          echo "$(pwd)/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$(pwd)/bin:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Fetch the newest nightly and the packages of Kiri
        run: |
          set -e
          HAIKU=https://eu.hpkg.haiku-os.org/haiku/master/x86_64/current
          KIRI=https://kiri.sen-labs.org/x86_64
          mkdir -p dl nightly pkg
          # "current" redirects to the folder of the newest nightly, which has its version in the name
          VERSION=$(curl -sI "$HAIKU/packages/" | tr -d '\r' | sed -n 's|^[Ll]ocation: .*/\(r1~[^/]*\)/packages.*|\1|p')
          HAIKU_PKG="haiku-$VERSION-1-x86_64.hpkg"
          # the packages of Kiri are on its page
          newest() { curl -sf "$KIRI/packages/" | grep -o "href=\"$1-[0-9][^\"]*x86_64.hpkg\"" | sed 's/href="//; s/"$//' | sort -V | tail -1; }
          AKITA_PKG=$(newest akita)
          TYPES_PKG=$(newest sen_filetypes)
          echo "haiku: $HAIKU_PKG, akita: $AKITA_PKG, sen_filetypes: $TYPES_PKG" | tee -a $GITHUB_STEP_SUMMARY
          [ -n "$VERSION" ] && [ -n "$AKITA_PKG" ] && [ -n "$TYPES_PKG" ]
          curl -sfL "https://haiku-repository.cdn.haiku-os.org/master/x86_64/$VERSION/packages/$HAIKU_PKG" -o "dl/$HAIKU_PKG"
          curl -sfL "$KIRI/packages/$AKITA_PKG" -o "dl/$AKITA_PKG"
          curl -sfL "$KIRI/packages/$TYPES_PKG" -o "dl/$TYPES_PKG"
          package extract -C nightly "dl/$HAIKU_PKG" lib
          mkdir -p pkg/akita pkg/types
          package extract -C pkg/akita "dl/$AKITA_PKG"
          package extract -C pkg/types "dl/$TYPES_PKG"

      - name: Check
        run: |
          set -e
          ls nightly/lib | head -50
          # the runtime of the compiler (libgcc_s, libstdc++: std::, operator new and delete, typeinfo of the basic types) is the package gcc_syslibs, not part of the nightly
          RUNTIME='^(__cxa_|__gxx_|__dynamic_cast|_Unwind_|__register_frame|__deregister_frame|_ZN?K?S[a-z]|_ZTVSt|_ZTISt|_ZTSSt|_ZTTSt|_ZTVN10__cxxabiv|_ZTIN10__cxxabiv|_ZTI[a-z]$|_Zd[al]Pv|_Zn[aw][mj])'
          # every program and library of the packages, against the libraries of the nightly and the libraries that come with the packages
          LIBS=""
          for d in $(find pkg -type d -name lib); do LIBS="$LIBS -l $d"; done
          FILES=$(find pkg -type f -exec sh -c 'head -c4 "$1" | grep -q ELF && echo "$1"' _ {} \;)
          echo "$FILES"
          ./abi-check.sh -i "$RUNTIME" -l nightly/lib $LIBS $FILES
